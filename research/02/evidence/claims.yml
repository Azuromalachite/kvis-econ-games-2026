  - id: claim.colonial.fixed_quotas
    statement: >
      Colonial obligations were assessed from population counts, but tribute
      assessments and official mita allocations followed different paths of
      adjustment; the game holding both totals fixed is a simplification.
    layer: documented
    status: partly_supported
    sources: [upenn_dia_mita, zagalsky2014]
    pages:
