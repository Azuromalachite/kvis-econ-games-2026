  # --- land and farming -------------------------------------------------------

  - id: claim.land.vertical_archipelago
    statement: >
      Andean communities held land at several altitudes, so one frost or drought
      rarely ruined everything.
    layer: interpretation
    status: unverified
    sources: [murra1972]
    pages:
      - path: projects/02/index.html
        anchor: describes access to resources at different heights, often in separate places
      - path: research/02/notes/history-and-evidence.md
        anchor: 'Murra (1972), the "vertical archipelago"'
    notes: Murra described access rights to separate islands of land; the game draws one slope.

  - id: claim.game.frost_from_top
    statement: >
      In the game, frost always strikes from the top down: when it reaches a zone,
      every zone above it freezes too. So a higher field is never safer than a
      lower one, and spreading crews uphill adds room, not frost insurance.
    layer: game_assumption
    status: labelled
    sources: [trasmonte2008]
    code: ["const line = r < .15 ? 4 : r < .45 ? 3 : r < .80 ? 2 : r < .97 ? 1 : 0;"]
    pages:
      - path: projects/02/index.html
        anchor: spreading crews uphill adds room, not insurance
      - path: research/02/notes/history-and-evidence.md
        anchor: In the game, frost always strikes from the top down
    notes: >
      Frost risk rising with altitude is supported by Trasmonte et al. (2008,
      abstract read) for the Mantaro basin. That frost never hits a lower zone
      while sparing a higher one is the game's simplification. A strategy sweep
      (docs/strategies-2026-11-18.md) showed its consequence: placing crews on the
      best land first beats spreading them across zones in every comparison, so
      the game's text no longer calls spreading insurance. Until 2026-11-18 it
      did. Murra's insurance argument rests on bad years that hit heights
      differently (claim.land.vertical_archipelago), which the game does not model.
      Pouteau et al. (2011, sections read; claim.climate.topoclimate) find local
      terrain effects on frost, through drainage and exposure at about 1 km,
      alongside the elevation gradient. Our inference, not theirs: cold-air
      drainage is how a lower field can freeze while a higher one does not,
      which the rule does not allow. That cuts against its
      historical footing; it stays a labelled simplification until a source
      gives joint crop-loss probabilities by height.

  - id: claim.land.zone_names
    statement: >
      Geographers name the Andean altitude zones with Quechua-derived terms (Pulgar
      Vidal 1941); the game uses plain descriptive names for four schematic zones
      whose real ranges overlap, and shows the nearest Pulgar Vidal name under each
      (Quechua, Suni, Suni–Puna, Puna).
    layer: documented
    status: partly_supported
    sources: [pulgarvidal1941]
    pages:
      - path: projects/02/index.html
        anchor: the game shows the nearest one under each zone
      - path: research/02/notes/history-and-evidence.md
        anchor: The game's four zones (valley, upper fields, high grain, puna)
    notes: >
      The lecture's zones sit higher than Pulgar Vidal's (maize up to 3,500 m), so
      Valley maps to his Quechua region and Upper fields to Suni; his low Yunga
      region, which the original game used, is not one of the lecture's zones.

  - id: claim.game.air_temperature
    statement: >
      Each zone's air temperature is an annual mean falling 6.5 °C per 1,000 m,
      anchored at about 12 °C at about 3,400 m (Cusco), at a representative
      altitude per zone. Display only; the frost model does not use it.
    layer: game_assumption
    status: labelled
    sources: [thitibordin_game]
    code: ["AIR_ANCHOR_C = 12, AIR_ANCHOR_M = 3400, LAPSE_C_PER_KM = 6.5"]
    pages:
      - path: projects/02/index.html
        anchor: The air temperatures are rough annual means
      - path: research/02/notes/history-and-evidence.md
        anchor: Air 6.5 °C colder per 1,000 m
    notes: >
      The lapse rate is the original game's. The original anchored it at about
      24 °C at sea level, which put maize land near 6 °C; the Cusco anchor was
      chosen instead and has not been checked against station data.

  - id: claim.game.soil_temperature
    statement: >
      Soil temperature is 4.2 °C below the air, plus 0.8 °C with terraces or
      1.6 °C with waru waru. Display only; the frost model does not use it.
    layer: game_assumption
    status: labelled
    sources: [thitibordin_game]
    code: ["SOIL_BELOW_AIR = 4.2, SOIL_WARM = {terraces:0.8, 'waru waru':1.6}"]
    pages:
      - path: projects/02/index.html
        anchor: that rule is a game assumption, not a measurement
      - path: research/02/notes/history-and-evidence.md
        anchor: Soil 4.2 °C below the air
    notes: >
      Kept from the original game. Measured mean soil temperature is often
      slightly warmer than mean air temperature, so the sign of the offset is
      worth checking with the original author.

  - id: claim.land.quechua_maize
    statement: >
      Maize grows in the warmer valleys below about 3,500 m; potatoes and other
      tubers grow higher; cold-tolerant kañiwa grows higher still; the puna is
      mainly llama and alpaca pasture.
    layer: documented
    status: partly_supported
    sources: [pulgarvidal1941, fonseca_dehaan2021]
    pages:
      - path: projects/02/index.html
        anchor: Cold-tolerant kañiwa, a small grain related to quinoa.
      - path: research/02/notes/history-and-evidence.md
        anchor: Maize grows in the warmer valleys below about 3,500 m

  - id: claim.land.chuno_keeps
    statement: Chuño, freeze-dried potato, keeps for years.
    layer: documented
    status: supported
    sources: [fonseca_dehaan2021, fao_chuno_blanco]
    pages:
      - path: projects/02/index.html
        anchor: dried by day until they keep for years
      - path: research/02/notes/history-and-evidence.md
        anchor: Chuño keeps for years
    notes: >
      Supported for modern chuño by the FAO page (read 2026-11-18). That chuño kept
      as long in 1500 is assumed, not shown.

  - id: claim.land.chuno_process
    statement: >
      Chuño is made by leaving potatoes out to freeze at night and in the sun by
      day; white chuño is then soaked for weeks and sun-dried again.
    layer: documented
    status: supported
    sources: [fao_chuno_blanco]
    pages:
      - path: projects/02/index.html
        anchor: Chuño is made after the harvest, when potatoes freeze at night and dry in the sun by day
      - path: research/02/notes/history-and-evidence.md
        anchor: Chuño is made by freezing potatoes at night and drying them in the sun by day
    notes: >
      A modern description of the process, not a record of colonial practice or
      rates. The source does not name the season; that chuño is made in the
      dry-season winter after the harvest is common knowledge here, not sourced.

  - id: claim.game.chuno_winter
    statement: >
      Each harvest is followed by a winter that is hard (1 in 4), normal (1 in 2)
      or mild (1 in 4). A chuño crew can freeze-dry 130%, 100% or 70% of its
      normal 120 kcal per person per day. The multipliers average 1, the winter
      is unknown when crews are planned, and it comes from the same seed as the
      rest of the weather without changing the earlier draws.
    layer: game_assumption
    status: labelled
    sources: [fao_chuno_blanco]
