  - id: claim.climate.drought_el_nino
    statement: >
      In the southern Andes El Niño years tend to be dry, though not everywhere or
      always: the rainfall response differs between station groups in southern
      Peru and Bolivia. A dry year is not thereby an El Niño year.
    layer: documented
    status: partly_supported
    sources: [orlove2000, jonaitis_etal2021]
    pages:
      - path: projects/02/index.html
        anchor: in the southern Andes El Niño years tend to be dry, though not everywhere
    notes: >
      The game's harvest report used to say "what we now link to El Niño", which
      read as a rule, and then (#30, briefly) that dry years are often linked to
      El Niño, which reversed the conditional the sources support. Orlove et al. (2000, abstract read) tie El Niño years to
      lower rainfall and the Pleiades forecast; Jonaitis et al. (2021, sections
      read) find the relationship varies across southern Peru and Bolivia, with
      some station groups showing insignificant or opposite signs. The game's
      droughts are drawn at random and do not model ENSO.

