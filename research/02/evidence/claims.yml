    notes: >
      Quota-setting from the 1570s counts is supported by a reference work. How
      often recounts (revisitas) lowered them is not settled here: tribute could be
      reassessed (claim.research.tribute_reassessment), and whether mita quotas
      were reset in practice is partly addressed by claim.research.quota_tribute_paths
      and claim.research.quota_fulfilment; Cole (1985) remains a reading lead.
      The game keeps both fixed; that is a simplification, labelled in the game.
      The historical statement is narrowed here; the player-facing wording that
      groups both obligations together was a documented follow-up in the
      food-access implementation review; since 2026-11-19 the game says tribute
      could be reassessed and mita allocations followed a different process.
      Not a reason to upgrade this claim.
      The PR #1 review removed the book-presentation transcript from this claim's
      sources, because it qualifies the claim rather than supporting it.

