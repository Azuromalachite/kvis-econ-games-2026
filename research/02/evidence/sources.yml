# Sources behind the game and docs/history-and-evidence.md.
#
# access: the deepest level reached for this source in this project, ordered:
#   full_text_read   the relevant part of the work itself was read
#   figures_checked  the specific numbers used were checked against the work or its tables
#   abstract_read    only the abstract (or publisher summary) was read
#   reference_work   only a reference or teaching page describing it was read
#   from_notes       cited from a reading note or literature review written by someone else
#   not_read         cited by title only
#
# by / when: who reached that level, and when. "review agent" means one of the
# independent reviews run on 2026-11-17 (claims and charts; model logic).
#
# url: DOI or page someone else can open to re-find the work. null means not
# recorded, never "not applicable".

